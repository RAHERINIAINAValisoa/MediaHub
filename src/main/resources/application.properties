spring.application.name=mediahub

# Chargement du fichier .env (format cles=valeurs) situé dans le dossier de lancement
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# --- PostgreSQL (valeurs lues depuis .env ou les variables d'environnement) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mediahub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Création des tables au démarrage (schema.sql est idempotent)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- Téléversements ---
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:20MB}

# --- Premier démarrage ---
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.admin.email=${ADMIN_EMAIL:admin@mediahub.com}
app.admin.password=${ADMIN_PASSWORD:}

# --- Interface ---
spring.web.locale=fr
spring.web.locale-resolver=fixed
spring.thymeleaf.cache=true
server.servlet.session.timeout=2h
