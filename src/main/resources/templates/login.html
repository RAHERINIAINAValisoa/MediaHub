<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-content">
<div class="container">

    <div class="auth-wrapper" data-aos="fade-up">
        <div class="glass-panel">
            <h2 style="text-align: center; margin-bottom: 24px; font-weight: 800;">Connexion</h2>

            <form th:action="@{/login}" method="post" id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Adresse email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="jean.dupont@example.com" th:value="${email}" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Se connecter</button>
            </form>

            <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
                Pas encore membre ? <a th:href="@{/register}" style="color: var(--accent); font-weight: 600;">S'inscrire</a>
            </p>
        </div>
    </div>

</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
